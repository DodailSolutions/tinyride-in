<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyRide — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #FAFAF9;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .logo {
      height: 36px;
      width: auto;
      margin-bottom: 24px;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background-color: #F1F5F9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      color: #64748B;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .notice {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 24px;
      text-align: left;
    }
    .notice strong {
      color: #0F172A;
      display: block;
      margin-bottom: 2px;
    }
    button {
      background-color: #006B2F;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease;
    }
    button:active {
      background-color: #005525;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/brand/logo-horizontal.png" alt="TinyRide" class="logo" />
    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You’re offline</h1>
    <p>Please check your internet connection. Some TinyRide information may not be up to date.</p>
    
    <div class="notice">
      <strong>Live Tracking Suspended</strong>
      Live vehicle GPS telemetry requires an active internet connection. Real-time arrival updates will resume once connected.
    </div>

    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
