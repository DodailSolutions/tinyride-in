<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008038" />
      <stop offset="100%" stop-color="#005a27" />
    </linearGradient>

    <!-- Roof Canopy Gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Windshield Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.7" />
    </linearGradient>

    <!-- Headlight Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Emerald Green -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />

  <!-- Road / Motion Arc beneath the rickshaw -->
  <path d="M 64 398 Q 230 422 448 376" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 16" />

  <!-- VEHICLE GROUP -->
  <g transform="translate(4, -6)">
    <!-- Yellow Canopy / Roof -->
    <path d="M 124 138 C 158 116 230 110 326 114 C 362 116 386 138 398 178 L 406 208 C 410 224 402 236 384 236 L 108 236 C 96 236 90 224 94 212 L 106 172 C 110 152 116 142 124 138 Z" fill="url(#roofGrad)" />
    
    <!-- Roof Overhang Rim -->
    <path d="M 94 224 C 94 224 230 220 404 224 C 414 224 416 234 406 238 L 396 242 C 386 244 380 246 112 246 C 98 246 90 238 94 224 Z" fill="#D97706" />

    <!-- Cabin / Body Base (Bright School Green & White) -->
    <!-- Rear & Passenger Frame -->
    <path d="M 102 236 L 102 334 C 102 354 116 368 136 368 L 292 368 C 298 368 304 362 304 354 L 304 236 Z" fill="#004D20" />
    
    <!-- Outer Cab Body (Vibrant Green) -->
    <path d="M 108 244 L 108 330 C 108 344 118 356 134 356 L 268 356 L 268 304 L 312 304 C 322 304 328 312 332 324 L 342 356 L 394 356 C 416 356 428 340 422 316 L 402 244 Z" fill="#009E47" />

    <!-- Front Cowl & Dashboard -->
    <path d="M 334 236 L 402 236 C 414 236 422 246 420 258 L 408 308 C 404 322 392 332 376 332 L 334 332 Z" fill="#007A34" />

    <!-- Windshield Glass -->
    <path d="M 332 152 L 382 154 C 392 154 398 162 402 174 L 416 226 C 418 232 414 236 406 236 L 332 236 Z" fill="url(#glassGrad)" stroke="#004D20" stroke-width="4" />
    
    <!-- Windshield Reflection Glare -->
    <path d="M 346 160 L 370 160 L 350 230 L 338 230 Z" fill="#FFFFFF" fill-opacity="0.45" />

    <!-- Passenger Window Opening -->
    <rect x="126" y="162" width="134" height="66" rx="8" fill="#003B18" fill-opacity="0.6" />
    
    <!-- Student Safety Frame Bars -->
    <line x1="192" y1="162" x2="192" y2="228" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />

    <!-- Cheerful Golden Heart Emblem on Door -->
    <path d="M 194 286 C 194 274 208 266 218 276 C 228 266 242 274 242 286 C 242 302 222 314 218 318 C 214 314 194 302 194 286 Z" fill="#FBBF24" />

    <!-- Headlight (Glowing Warm Amber) -->
    <ellipse cx="424" cy="272" rx="14" ry="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4" filter="url(#glow)" />
    <ellipse cx="425" cy="272" rx="8" ry="12" fill="#FFFFFF" />

    <!-- Front Indicator -->
    <rect x="396" y="278" width="16" height="8" rx="3" fill="#F59E0B" />

    <!-- Side Fender -->
    <path d="M 124 354 C 124 326 150 304 182 304 C 214 304 240 326 240 354 Z" fill="#003B18" />

    <!-- Rear Wheel -->
    <g transform="translate(182, 362)">
      <!-- Outer Tire -->
      <circle r="44" fill="#0F172A" />
      <circle r="44" fill="none" stroke="#1E293B" stroke-width="4" />
      <!-- Rim -->
      <circle r="26" fill="#94A3B8" />
      <circle r="18" fill="#CBD5E1" />
      <!-- Hubcap -->
      <circle r="8" fill="#006B2F" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(372, 368)">
      <!-- Outer Tire -->
      <circle r="36" fill="#0F172A" />
      <!-- Rim -->
      <circle r="20" fill="#94A3B8" />
      <circle r="14" fill="#CBD5E1" />
      <!-- Hubcap -->
      <circle r="6" fill="#006B2F" />
    </g>

    <!-- Front Bumper -->
    <rect x="408" y="342" width="20" height="12" rx="4" fill="#334155" />
    <!-- Rear Mudguard/Step -->
    <rect x="96" y="336" width="18" height="10" rx="3" fill="#334155" />
  </g>
</svg>
