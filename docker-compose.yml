# ==============================================================================
# TinyRide Local Staging Orchestration
# Company: Dodail Solutions Private Limited
# Platform: NestJS API + Admin Web Console + School Web Portal
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # TinyRide Core API Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyride-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL:-https://bfdcxaenmdomjsbvcbpj.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET:-tinyride-staging-jwt-secret-do-not-use-in-production}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-rzp_webhook_secret_placeholder}
      - CORS_ORIGIN=http://localhost:3001,http://localhost:3002
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tinyride-net

  # ----------------------------------------------------------------------------
  # TinyRide Admin Operations Console
  # ----------------------------------------------------------------------------
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: tinyride-admin-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tinyride-net

  # ----------------------------------------------------------------------------
  # TinyRide School Web Portal
  # ----------------------------------------------------------------------------
  school-web:
    build:
      context: .
      dockerfile: apps/school-web/Dockerfile
    container_name: tinyride-school-web
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=staging
      - PORT=3002
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tinyride-net

networks:
  tinyride-net:
    driver: bridge
